<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteo Alumnos</title>
    <!-- Aqui abajo van los Estilos (CSS) -->
    <style>
        h1 {
            color: green;
        }

        header {
            background-color: blueviolet;
            color: white;
        }

        header>h1 {
            color: red;
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(90deg, #ff7e5f 0%, #feb47b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        button {
            background-color: cadetblue;
            color: white;
            padding: 5px;
        }

        button:hover {
            scale: 1.1;
        }

        a {
            outline: none;
            text-decoration: none;
            padding: 2px 1px 0;
        }

        a:link {
            color: #d09e0be1;
        }

        a:visited {
            color: #437a16;
        }

        a:hover {
            border-bottom: 1px solid;
            background: #cdfeaa;
        }
    </style>
</head>

<body>
    <header>
        <h1>Sorteo Alumnos</h1>
        <h4>Agregá alumnos y sorteá quién participa</h4>

            alert("Hola, " + nombre + " " + apellido + "!");
